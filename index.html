<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Doodle Duel</title>
<meta name="description" content="A mobile-friendly multiplayer draw-and-guess game. Create a room, share the link, draw and guess with friends.">
<meta property="og:title" content="Doodle Duel">
<meta property="og:description" content="Draw, guess, laugh. A phone-friendly multiplayer drawing game.">
<meta property="og:type" content="website">
<meta property="og:image" content="/icon-512.png">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doodle Duel">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js" defer></script>
<script src="/words.js"></script>
</head>
<body>
<section id="home">
  <div class="panel">
    <h1 class="logo">Doodle <span>Duel</span> ✏️</h1>
    <p class="sub">Draw it. Guess it. Win it.</p>
    <div class="avpick">
      <button id="avBig" class="avbig" type="button" aria-label="Change avatar">🐱</button>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="nickname" enterkeyhint="go">
        <div class="cols" id="avCols"></div>
      </div>
    </div>
    <div class="avgrid hide" id="avGrid"></div>
    <div id="joinBox" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <p class="sub">Joining room <b id="joinCode"></b></p>
      <button id="btnJoin">Join game</button>
      <button id="btnNotThis" class="soft" type="button">Create my own room instead</button>
    </div>
    <div id="hostBox" style="display:flex;flex-direction:column;gap:10px">
      <button id="btnCreate">Create room</button>
      <div class="row"><input id="code" maxlength="6" placeholder="Room code" autocapitalize="characters" style="text-transform:uppercase"><button id="btnJoinCode" class="ghost">Join</button></div>
      <button id="btnBrowse" class="soft" type="button">🌐 Browse public rooms</button>
      <div id="rooms" class="rooms hide"></div>
    </div>
    <button id="btnInstall" class="soft hide" type="button">📲 Install app</button>
    <div class="err" id="err"></div>
  </div>
</section>

<section id="game" class="hide">
  <div class="top">
    <div class="timer" id="timer">–</div>
    <div class="hint"><div class="w" id="hintW">Lobby</div><small id="hintSub"></small></div>
    <button class="ib" id="btnMute" type="button" aria-label="Sound">🔊</button>
    <button class="ib" id="btnShare" type="button" aria-label="Invite">📤</button>
    <button class="ib" id="btnMenu" type="button" aria-label="Menu">⋯</button>
  </div>
  <div class="players" id="players"></div>
  <div class="stage">
    <div class="cvwrap" id="cvwrap"><canvas id="cv" width="800" height="600"></canvas></div>
    <button class="zr hide" id="zoomReset" type="button">⤢ Reset zoom</button>
    <div class="overlay" id="ov"></div>
    <div class="banner hide" id="banner"></div>
  </div>
  <div class="tools hide" id="tools"></div>
  <div class="gbar hide" id="gbar"></div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <form class="send" id="sendForm">
    <input id="msg" maxlength="60" placeholder="Type your guess…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
    <button>Send</button>
  </form>
</section>
<canvas id="confetti" class="hide"></canvas>
<script src="/app.js"></script>
</body>
</html>
